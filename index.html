<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Wayfinder</title>
  <meta name="description" content="A small demo of a map and walking navigation app. The place on the map is made up.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <div id="map"></div>
    <div class="search">
      <input id="search" type="search" placeholder="Search a place" autocomplete="off" aria-label="Search a place">
      <ul id="results" hidden></ul>
    </div>
    <div class="zoom">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </div>
    <section id="sheet" class="sheet"></section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
